name: BoltX AIO Master 6

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Custom Kernel Name (Leave empty for default)'
        required: false
        default: ''
        type: string
      kernel_source:
        description: 'Select Kernel Source Sync'
        required: true
        type: choice
        default: 'Rama'
        options:
          - 'Rama'
          - 'Kingfinik98'
      build_mode:
        description: 'Select Build Mode'
        required: true
        type: choice
        default: 'Single Variant'
        options:
          - 'Single Variant'
          - 'All Variants (Next, Rissu, SukiSU, Wild KSU, NonKSU)'
      root_variant:
        description: 'Select Root Variant (Only for Single Mode)'
        required: true
        type: choice
        default: 'KernelSU-Next'
        options:
          - 'KernelSU-Next'
          - 'Rissu (MamboSU)'
          - 'SukiSU'
          - 'Wild KSU'
          - 'Non-KSU'
      hook_method:
        description: 'Select Hook Method (Only for Single Mode - KSU Next, Rissu, Wild)'
        required: true
        type: choice
        default: 'susfs'
        options:
          - 'susfs'
          - 'kprobes'
      performance_patch:
        description: 'Select Device SoC for Performance Tuning'
        required: true
        type: choice
        default: 'Snapdragon'
        options:
          - 'Snapdragon'
          - 'MediaTek'
          - 'Universal'
      clang_version:
        description: 'Select Clang Version'
        required: true
        type: choice
        options:
          - 'r536225 (Clang 19)'
          - 'r547379 (Clang 20)'

permissions:
  contents: write

jobs:
  setup-matrix:
    name: Setup Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.build_mode }}" == "All Variants (Next, Rissu, SukiSU, Wild KSU, NonKSU)" ]; then
            echo "🚀 Mode: ALL VARIANTS BUILD (Priority: SukiSU First)"
            # SukiSU dipindahkan ke urutan paling awal agar mendapat prioritas resource
            echo 'matrix=[{"variant":"SukiSU","hook":"susfs"},{"variant":"KernelSU-Next","hook":"susfs"},{"variant":"KernelSU-Next","hook":"kprobes"},{"variant":"Rissu (MamboSU)","hook":"susfs"},{"variant":"Rissu (MamboSU)","hook":"kprobes"},{"variant":"Wild KSU","hook":"susfs"},{"variant":"Wild KSU","hook":"kprobes"},{"variant":"Non-KSU","hook":"none"}]' >> $GITHUB_OUTPUT
          else
            echo "🚀 Mode: SINGLE VARIANT BUILD"
            echo 'matrix=[{"variant":"${{ github.event.inputs.root_variant }}","hook":"${{ github.event.inputs.hook_method }}"}]' >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.variant }} (${{ matrix.hook }})
    runs-on: ubuntu-22.04
    needs: setup-matrix
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "titit"
          git config --global user.email "Kingfinik98@gmail.com"

      - name: Install build tools
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Init & Sync GKI
        run: |
          mkdir gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Update kernel source for GKI 5.10
        run: |
          cd gki/common
          if [ "${{ github.event.inputs.kernel_source }}" == "Kingfinik98" ]; then
            echo "🔧 Using Kingfinik98 Source"
            git remote add kingfinik98 https://github.com/Kingfinik98/kernel-android12-5.10.git
            git fetch -j12 kingfinik98
            git checkout -b update-master kingfinik98/master
          else
            echo "🔧 Using Rama Source"
            git remote add rama https://github.com/ramabondanp/android_kernel_common-5.10.git
            git fetch -j12 rama
            git checkout -b update-android12-5.10-staging rama/android12-5.10-staging
          fi
          rm -rf drivers/staging/kernelsu

      - name: Apply Performance Patch
        run: |
          echo "🚀 Applying Performance Patch for ${{ github.event.inputs.performance_patch }}"
          if [ "${{ github.event.inputs.performance_patch }}" == "Snapdragon" ]; then
            cd gki/common
            echo "🚀 [Snapdragon] Applying qcom-cpufreq-hw performance patch (Xiaomi Marble)"
            TARGET="drivers/cpufreq/qcom-cpufreq-hw.c"
            SRC_URL="https://raw.githubusercontent.com/Pzqqt/android_kernel_xiaomi_marble/refs/heads/melt-rebase/drivers/cpufreq/qcom-cpufreq-hw.c"
            curl -L "$SRC_URL" -o /tmp/qcom-cpufreq-hw.c
            cp /tmp/qcom-cpufreq-hw.c "$TARGET"
            echo "✅ [Snapdragon] Applied."
          elif [ "${{ github.event.inputs.performance_patch }}" == "MediaTek" ]; then
            echo "✅ [MediaTek] Config will be injected via defconfig."
          elif [ "${{ github.event.inputs.performance_patch }}" == "Universal" ]; then
            echo "✅ [Universal] Config will be injected via defconfig."
          fi

      - name: Tweak build config
        run: |
          sed -i '2d' gki/common/build.config.gki

      - name: Setup Root Variant & Inject Configs
        id: setup_root
        working-directory: gki/common
        run: |
          ROOT_VARIANT="${{ matrix.variant }}"
          HOOK_METHOD="${{ matrix.hook }}"
          PERF="${{ github.event.inputs.performance_patch }}"
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          echo "🧩 Starting Setup for Variant: $ROOT_VARIANT | Hook: $HOOK_METHOD"

          if [ "$ROOT_VARIANT" == "KernelSU-Next" ]; then
            for KSU_PATH in drivers/staging/kernelsu drivers/kernelsu KernelSU; do
              [ -d $KSU_PATH ] && rm -rf $KSU_PATH
            done
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            sed -i 's/$(error KSU requires Kprobes; enable it (defconfig))/# $(error KSU requires Kprobes; enable it (defconfig))/' drivers/kernelsu/Kbuild
            
            if [ "$HOOK_METHOD" = "susfs" ]; then
              git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
              rm -rf sus/.git
              susfs=sus/kernel_patches
              cp -r $susfs/fs . && cp -r $susfs/include . && cp -r $susfs/50_add_susfs_in_gki-android12-5.10.patch .
              patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
            fi

            echo "CONFIG_KSU=y" >> $DEFCONFIG
            echo "CONFIG_KPM=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> $DEFCONFIG
            echo "CONFIG_KSU_SYSCALL_HOOK=n" >> $DEFCONFIG
            echo "CONFIG_KPROBES=y" >> $DEFCONFIG
            echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
            
            if [ "$HOOK_METHOD" = "susfs" ]; then
              echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_MANUAL_HOOK=n" >> $DEFCONFIG
              echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
            else
              echo "CONFIG_KSU_SUSFS=n" >> $DEFCONFIG
              echo "CONFIG_KSU_MANUAL_HOOK=n" >> $DEFCONFIG
              echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
            fi

          elif [ "$ROOT_VARIANT" == "Rissu (MamboSU)" ]; then
            for KSU_PATH in drivers/staging/kernelsu drivers/kernelsu KernelSU; do
              [ -d $KSU_PATH ] && rm -rf $KSU_PATH
            done
            
            if [ "$HOOK_METHOD" = "susfs" ]; then
               curl -LSs "https://github.com/Kingfinik98/KernelSU/blob/susfs-rksu-master/kernel/setup.sh" | bash -s susfs-rksu-master
            else
               curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main
            fi
            
            curl -LSs "https://raw.githubusercontent.com/Kingfinik98/gki-builder/15ddb8c469eab27491d5bb0f8f66b7fe2c15d0d7/kernel-patches/ksu/rksu-add-mambosu-manager-support.patch" -o /tmp/rksu_manager.patch
            cd KernelSU && patch -p1 < /tmp/rksu_manager.patch && cd ..
            
            if [ "$HOOK_METHOD" = "susfs" ]; then
               git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
               rm -rf sus/.git
               susfs=sus/kernel_patches
               cp -r $susfs/fs . && cp -r $susfs/include . && cp -r $susfs/50_add_susfs_in_gki-android12-5.10.patch .
               patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
            fi

            echo "CONFIG_KSU=y" >> $DEFCONFIG
            echo "CONFIG_KPM=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> $DEFCONFIG
            echo "CONFIG_KSU_SYSCALL_HOOK=n" >> $DEFCONFIG
            echo "CONFIG_KPROBES=y" >> $DEFCONFIG
            echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
            
            if [ "$HOOK_METHOD" = "susfs" ]; then
              echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=n" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=n" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_MANUAL_HOOK=n" >> $DEFCONFIG
              echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
            else
              echo "CONFIG_KSU_SUSFS=n" >> $DEFCONFIG
              echo "CONFIG_KSU_MANUAL_HOOK=n" >> $DEFCONFIG
              echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
            fi

          elif [ "$ROOT_VARIANT" == "SukiSU" ]; then
            rm -rf drivers/staging/kernelsu
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s tmp-builtin
            git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
            rm -rf sus/.git
            susfs=sus/kernel_patches
            cp -r $susfs/fs . && cp -r $susfs/include . && cp -r $susfs/50_add_susfs_in_gki-android12-5.10.patch .
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch

            echo "CONFIG_KSU=y" >> $DEFCONFIG
            echo "CONFIG_KPM=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> $DEFCONFIG
            echo "CONFIG_KSU_SYSCALL_HOOK=n" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
            echo "CONFIG_KSU_MANUAL_HOOK=n" >> $DEFCONFIG
            echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
            echo "CONFIG_KPROBES=y" >> $DEFCONFIG
            echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
            echo "CONFIG_KRETPROBES=y" >> $DEFCONFIG
            echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

          elif [ "$ROOT_VARIANT" == "Wild KSU" ]; then
            for KSU_PATH in drivers/staging/kernelsu drivers/kernelsu KernelSU; do
              [ -d $KSU_PATH ] && rm -rf $KSU_PATH
            done
            echo "➡️ add Wild_KSU"
            curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
            echo "✅ Wild_KSU added"
            sed -i 's/$(error KSU requires Kprobes; enable it (defconfig))/# $(error KSU requires Kprobes; enable it (defconfig))/' drivers/kernelsu/Kbuild
            
            if [ "$HOOK_METHOD" = "susfs" ]; then
              git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
              rm -rf sus/.git
              susfs=sus/kernel_patches
              cp -r $susfs/fs . && cp -r $susfs/include . && cp -r $susfs/50_add_susfs_in_gki-android12-5.10.patch .
              patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
              echo "[✓] SUSFS patched"
            fi

            # Wild KSU Configs
            echo "CONFIG_KSU=y" >> $DEFCONFIG
            echo "CONFIG_KPM=y" >> $DEFCONFIG
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> $DEFCONFIG
            echo "CONFIG_KSU_SYSCALL_HOOK=n" >> $DEFCONFIG
            echo "CONFIG_KPROBES=y" >> $DEFCONFIG
            echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
            echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
            
            if [ "$HOOK_METHOD" = "susfs" ]; then
              echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
              echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
              echo "CONFIG_KSU_MANUAL_HOOK=n" >> $DEFCONFIG
              echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
            else
              echo "CONFIG_KSU_SUSFS=n" >> $DEFCONFIG
              echo "CONFIG_KSU_MANUAL_HOOK=n" >> $DEFCONFIG
              echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
            fi

          elif [ "$ROOT_VARIANT" == "Non-KSU" ]; then
            rm -rf drivers/staging/kernelsu drivers/kernelsu KernelSU
          fi

          echo "⚙️ Applying Common Performance & Network Configs..."
          
          if [ "$PERF" = "MediaTek" ]; then
            # Config MediaTek spesifik (selain HZ) bisa ditambahkan disini jika ada
            : # no-op
          elif [ "$PERF" = "Universal" ]; then
            echo "CONFIG_CPU_FREQ=y" >> $DEFCONFIG
            echo "CONFIG_HIGH_RES_TIMERS=y" >> $DEFCONFIG
          fi
          
          # TMPFS_XATTR sudah ada di sini (berlaku global untuk semua tipe build)
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_BIC=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_HTCP=n" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> $DEFCONFIG
          echo "CONFIG_SCHED_TUNE=y" >> $DEFCONFIG
          echo "CONFIG_MQ_IOSCHED_KYBER=y" >> $DEFCONFIG
          echo "CONFIG_MQ_IOSCHED_BFQ=y" >> $DEFCONFIG
          echo "CONFIG_IOSCHED_BFQ=y" >> $DEFCONFIG
          echo "CONFIG_BFQ_GROUP_IOSCHED=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_WRITEBACK=y" >> $DEFCONFIG
          
          echo "✅ Setup & Config Injection Complete"

      - name: Apply common fixes
        working-directory: gki/common
        run: |
          echo "Applying fixes for Kingfinik98 kernel source..."

      - name: Fix Stack Protector
        working-directory: gki/common
        run: |
          echo "🛠️ Applying manual Stack Protector fix "
          sed -i '/config STACKPROTECTOR_PER_TASK/{n;s/def_bool y/bool "Stack Protector per task"\n\tdefault y/;}' arch/arm64/Kconfig
          echo "# CONFIG_STACKPROTECTOR_PER_TASK is not set" >> arch/arm64/configs/gki_defconfig
          echo "✅ Stack Protector fix applied manually."

      - name: Patch module & DRM (Xiaomi Compat)
        working-directory: gki/common
        run: |
          echo "🩹 Menerapkan patch kompatibilitas untuk perangkat Xiaomi"
          sed -i '/pr_warn.*disagrees about version of symbol.*/,+1 s/.*/return 1;/' kernel/module.c
          sed -i '/^static int drm_atomic_check_valid_clones/,/^}/d' drivers/gpu/drm/drm_atomic_helper.c
          sed -i '/ret = drm_atomic_check_valid_clones/,/return ret;/d' drivers/gpu/drm/drm_atomic_helper.c
          echo "✅ Perbaikan selesai"

      - name: Remove check_defconfig
        run: |
          echo "🧹 [Clean-Up] Deleting check_defconfig"
          sed -i 's/check_defconfig//' gki/common/build.config.gki

      - name: Fix SUSFS Uname Symbol Error
        working-directory: gki/common
        run: |
          # Khusus KernelSU-Next karena struktur supercalls.c berbeda dan patch SUSFS yang dipakai tidak memiliki symbol yang diminta
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            echo "🛠️ Applying fix for undefined SUSFS symbols (KernelSU-Next)..."
            # Disable SUSFS Uname handling block in supercalls.c to use standard kernel spoofing
            # This fixes the linker error caused by missing functions in the current SUSFS patch
            sed -i 's/#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME/#if 0 \/\* CONFIG_KSU_SUSFS_SPOOF_UNAME Disabled to fix build \*\//' drivers/kernelsu/supercalls.c
            echo "✅ SUSFS symbol fix applied for KernelSU-Next."
          else
            echo "⏭️ Skipping SUSFS fix (Not needed for ${{ matrix.variant }})"
          fi

      - name: Set version
        working-directory: gki/common
        run: |
          echo "" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          
          KERNEL_NAME_INPUT="${{ github.event.inputs.kernel_name }}"
          ROOT_VARIANT="${{ matrix.variant }}"
          HOOK_METHOD="${{ matrix.hook }}"
          PERF="${{ github.event.inputs.performance_patch }}"

          SUFFIX=""
          if [ -n "$KERNEL_NAME_INPUT" ]; then
            SUFFIX="-$KERNEL_NAME_INPUT"
          fi

          if [ "$ROOT_VARIANT" == "KernelSU-Next" ]; then SUFFIX="$SUFFIX-Next";
          elif [ "$ROOT_VARIANT" == "Rissu (MamboSU)" ]; then SUFFIX="$SUFFIX-Rissu";
          elif [ "$ROOT_VARIANT" == "SukiSU" ]; then SUFFIX="$SUFFIX-SukiSU";
          elif [ "$ROOT_VARIANT" == "Wild KSU" ]; then SUFFIX="$SUFFIX-Wild";
          elif [ "$ROOT_VARIANT" == "Non-KSU" ]; then SUFFIX="$SUFFIX-NonKSU";
          fi

          if [ "$ROOT_VARIANT" == "KernelSU-Next" ] || [ "$ROOT_VARIANT" == "Rissu (MamboSU)" ] || [ "$ROOT_VARIANT" == "Wild KSU" ]; then
             if [ "$HOOK_METHOD" = "susfs" ]; then SUFFIX="$SUFFIX-ඞ-SuS"; fi
          elif [ "$ROOT_VARIANT" == "SukiSU" ]; then
             SUFFIX="$SUFFIX-ඞ-SuS"
          fi

          if [ "$PERF" = "Snapdragon" ]; then SUFFIX="$SUFFIX-Qcom";
          elif [ "$PERF" = "MediaTek" ]; then SUFFIX="$SUFFIX-Mtk";
          elif [ "$PERF" = "Universal" ]; then SUFFIX="$SUFFIX-Univ";
          fi
          
          echo "Setting custom kernel name: $SUFFIX"
          if grep -q '^EXTRAVERSION *=' Makefile; then
            sed -i "s/^EXTRAVERSION *=.*/EXTRAVERSION = $SUFFIX/" Makefile
          else
            echo "EXTRAVERSION = $SUFFIX" >> Makefile
          fi

      - name: Setup Clang
        working-directory: gki
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            CLANG_VER="clang-r536225"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            CLANG_VER="clang-r547379"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          echo "CLANG_VER=$CLANG_VER" >> $GITHUB_ENV
          mkdir -p prebuilts-master/clang/host/linux-x86/$CLANG_VER
          cd prebuilts-master/clang/host/linux-x86
          curl -L "${CLANG_URL}" | tar -xz -C $CLANG_VER
          rm -rf clang-r563880b
          ln -sf $CLANG_VER clang-r563880b

      - name: Commit changes
        working-directory: gki/common
        run: |
          git add .
          git commit -m "Final clean tree before build" || true

      - name: Compile
        working-directory: gki
        run: |
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Setup Environment Variables for Packaging
        id: vars
        run: |
          ROOT_VARIANT="${{ matrix.variant }}"
          BASE_LINUX_VERSION=$(make -s kernelversion -C gki/common | tr -d '\n\r')
          echo "BASE_LINUX_VERSION=$BASE_LINUX_VERSION" >> $GITHUB_ENV
          LINUX_VERSION=$(make -s kernelversion -C gki/common | tr -d '\n\r')
          echo "LINUX_VERSION=$LINUX_VERSION" >> $GITHUB_ENV
          
          CUSTOM_KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
          [ -z "$CUSTOM_KERNEL_NAME" ] && KERNEL_NAME="BoltX" || KERNEL_NAME="$CUSTOM_KERNEL_NAME"
          echo "KERNEL_NAME=$KERNEL_NAME" >> $GITHUB_ENV

          if [ "$ROOT_VARIANT" == "KernelSU-Next" ]; then 
             [ "${{ matrix.hook }}" == "susfs" ] && VARIANT="Next-SuS" || VARIANT="Next-Kprobes"
          elif [ "$ROOT_VARIANT" == "Rissu (MamboSU)" ]; then
             [ "${{ matrix.hook }}" == "susfs" ] && VARIANT="Rissu-SuS" || VARIANT="Rissu-Kprobes"
          elif [ "$ROOT_VARIANT" == "Wild KSU" ]; then
             [ "${{ matrix.hook }}" == "susfs" ] && VARIANT="Wild-SuS" || VARIANT="Wild-Kprobes"
          elif [ "$ROOT_VARIANT" == "SukiSU" ]; then
             VARIANT="SukiSU"
          elif [ "$ROOT_VARIANT" == "Non-KSU" ]; then
             VARIANT="NonKSU"
          fi
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV

          BUILD_DATE=$(date +"%Y%m%d")
          RELEASE="v${BUILD_DATE}"
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "AK3_ZIP_NAME=AK3-${KERNEL_NAME}-${RELEASE}-${BASE_LINUX_VERSION}-${VARIANT}.zip" >> $GITHUB_ENV
          echo "KBUILD_BUILD_TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S %Z")" >> $GITHUB_ENV
          echo "COMPILER_STRING=${{ github.event.inputs.clang_version }}" >> $GITHUB_ENV
          
          SUSFS_VER="N/A"
          if [ "$ROOT_VARIANT" != "Non-KSU" ]; then
            SUSFS_VER=$(curl -s https://gitlab.com/simonpunk/susfs4ksu/raw/gki-android12-5.10/kernel_patches/include/linux/susfs.h | grep -E '^#define SUSFS_VERSION' | cut -d' ' -f3 | sed 's/"//g')
          fi
          echo "SUSFS_VERSION=$SUSFS_VER" >> $GITHUB_ENV

      - name: Package Kernel (AnyKernel3)
        run: |
          echo "🚀 Starting kernel packaging process..."
          ANYKERNEL_REPO="https://github.com/linastorvaldz/anykernel"
          ANYKERNEL_BRANCH="android12-5.10"
          KERNEL_IMAGE="$GITHUB_WORKSPACE/gki/out/android12-5.10/dist/Image"
          git clone -q --depth=1 $ANYKERNEL_REPO -b $ANYKERNEL_BRANCH anykernel
          
          KERNEL_STRING="${{ env.LINUX_VERSION }}"
          sed -i "s|kernel.string=.*|kernel.string=$KERNEL_STRING|g" anykernel/anykernel.sh

          cd anykernel
          echo "🗜️ Zipping anykernel..."
          cp "$KERNEL_IMAGE" .
          zip -r9 ../${{ env.AK3_ZIP_NAME }} ./*
          cd ..
          echo "✅ Zip file created: ${{ env.AK3_ZIP_NAME }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AK3_ZIP_NAME }}
          path: ${{ env.AK3_ZIP_NAME }}

      - name: Create GitHub Release (Single Mode)
        if: github.event.inputs.build_mode == 'Single Variant'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🚀 Creating GitHub Release (Single Mode)..."
          GKI_RELEASES_REPO="https://github.com/Kingfinik98/Kernel-Release"
          REPO_PATH=$(echo "$GKI_RELEASES_REPO" | sed 's|https://github.com/||')
          RELEASE_TAG="${{ env.KERNEL_NAME }}-${{ env.LINUX_VERSION }}-${{ env.RELEASE }}"
          
          ROOT_VARIANT="${{ matrix.variant }}"
          if [ "$ROOT_VARIANT" == "KernelSU-Next" ]; then ROOT_NAME="KernelSU-Next";
          elif [ "$ROOT_VARIANT" == "Rissu (MamboSU)" ]; then ROOT_NAME="MamboSU";
          elif [ "$ROOT_VARIANT" == "Wild KSU" ]; then ROOT_NAME="Wild KSU";
          elif [ "$ROOT_VARIANT" == "SukiSU" ]; then ROOT_NAME="SukiSU Ultra";
          else ROOT_NAME="Stock / No Root"; fi

          RELEASE_NOTES="🐧 *Linux Version*: ${{ env.LINUX_VERSION }}
          📅 *Build Date*: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          🛡️ *Root Method*: $ROOT_NAME
          ඞ *SuSFS*: ${{ env.SUSFS_VERSION }}
          🔰 *Compiler*: ${{ env.COMPILER_STRING }}
          ⚙️ *Performance*: ${{ github.event.inputs.performance_patch }}"

          gh release create "$RELEASE_TAG" "${{ env.AK3_ZIP_NAME }}" \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --repo "$REPO_PATH" \
            --latest
          echo "✅ Release created successfully"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}-${{ matrix.hook }}
          path: gki/out/android12-5.10/common/build.log
          if-no-files-found: warn

  release-all:
    name: Release All Variants
    needs: build
    if: github.event.inputs.build_mode == 'All Variants (Next, Rissu, SukiSU, Wild KSU, NonKSU)'
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (All-in-One)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🚀 Creating Unified GitHub Release for All Variants..."
          GKI_RELEASES_REPO="https://github.com/Kingfinik98/Kernel-Release"
          REPO_PATH=$(echo "$GKI_RELEASES_REPO" | sed 's|https://github.com/||')
          
          KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
          [ -z "$KERNEL_NAME" ] && KERNEL_NAME="BoltX"
          BUILD_DATE=$(date +"%Y%m%d")
          
          PERF_TUNE="${{ github.event.inputs.performance_patch }}"
          RELEASE_TAG="ALL-${KERNEL_NAME}-${PERF_TUNE}-v${BUILD_DATE}"
          
          echo "Tag Release: $RELEASE_TAG"

          # Auto delete release lama jika re-run
          gh release delete "$RELEASE_TAG" --repo "$REPO_PATH" --yes || true

          RELEASE_NOTES="🐧 *BoltX All-in-One Release*
          📅 *Build Date*: $(date +"%Y-%m-%d %H:%M:%S %Z")
          🛡️ *Variants*: SukiSU, KernelSU-Next, Rissu, Wild KSU, Non-KSU
          ⚙️ *Performance Tuning*: ${{ github.event.inputs.performance_patch }}
          🔰 *Compiler*: ${{ github.event.inputs.clang_version }}
          📦 *Contains*: All kernel zips for selected tuning mode."

          gh release create "$RELEASE_TAG" artifacts/**/*.zip \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --repo "$REPO_PATH" \
            --latest
          echo "✅ Unified Release created successfully"
