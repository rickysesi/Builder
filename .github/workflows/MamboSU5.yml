name: BoltX Kernel MamboSU5

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Custom Kernel Name (Leave empty for default)'
        required: false
        default: ''
        type: string
      release_status:
        description: 'Release Status'
        required: true
        type: choice
        default: 'RELEASE'
        options:
          - 'RELEASE'
          - 'BETA'
      clang_version:
        description: 'Select Clang Version'
        required: true
        type: choice
        options:
          - 'r536225 (Clang 19)'
          - 'r547379 (Clang 20)'
      performance_patch:
        description: 'Select Device SoC for Performance Tuning (Internal)'
        required: true
        type: choice
        default: 'Snapdragon'
        options:
          - 'Snapdragon'
          - 'MediaTek'
          - 'Universal'

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "titit"
          git config --global user.email "Kingfinik98@gmail.com"

      - name: Install build tools
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git curl repo build-essential bc bison flex libssl-dev \
            libelf-dev python3 python3-pip unzip zip rsync libncurses-dev lld

      - name: Init & Sync GKI
        run: |
          mkdir gki && cd gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc --all)

      - name: Update kernel source for GKI 5.10
        run: |
          cd gki/common
          git remote add rama https://github.com/ramabondanp/android_kernel_common-5.10.git
          git fetch -j12 rama
          git checkout -b update-android12-5.10-staging rama/android12-5.10-staging
          rm -rf drivers/staging/kernelsu

      - name: Apply Snapdragon Performance Patch
        if: github.event.inputs.performance_patch == 'Snapdragon'
        working-directory: gki/common
        run: |
          echo "🚀 [Snapdragon] Applying qcom-cpufreq-hw performance patch (Xiaomi Marble)"
          TARGET="drivers/cpufreq/qcom-cpufreq-hw.c"
          SRC_URL="https://raw.githubusercontent.com/Pzqqt/android_kernel_xiaomi_marble/refs/heads/melt-rebase/drivers/cpufreq/qcom-cpufreq-hw.c"
          if [ ! -f "$TARGET" ]; then
            echo "❌ Target file not found: $TARGET"
            exit 1
          fi
          curl -L "$SRC_URL" -o /tmp/qcom-cpufreq-hw.c
          grep -q "qcom_cpufreq_hw" /tmp/qcom-cpufreq-hw.c || exit 1
          cp /tmp/qcom-cpufreq-hw.c "$TARGET"
          echo "✅ [Snapdragon] Qualcomm CPUFreq HW performance patch applied."

      - name: Apply MediaTek Performance Tuning
        if: github.event.inputs.performance_patch == 'MediaTek'
        working-directory: gki/common
        run: |
          echo "🚀 [MediaTek] Applying performance tuning via defconfig (HZ=500)."

      - name: Apply Universal Configuration
        if: github.event.inputs.performance_patch == 'Universal'
        working-directory: gki/common
        run: |
          echo "🌐 [Universal] Using universal configuration for maximum compatibility."

      - name: Tweak build config
        run: |
          sed -i '2d' gki/common/build.config.gki

      - name: Setup MamboSU (Standard Kprobes Mode)
        working-directory: gki/common
        run: |
          echo "🧩 Setup MamboSU (Rissu)"
          
          # 1. Remove existing KernelSU drivers
          for KSU_PATH in drivers/staging/kernelsu drivers/kernelsu KernelSU; do
            if [ -d $KSU_PATH ]; then
              echo "MamboSU driver found in $KSU_PATH, Removing..."
              KSU_DIR=$(dirname "$KSU_PATH")
              [ -f "$KSU_DIR/Kconfig" ] && sed -i '/kernelsu/d' $KSU_DIR/Kconfig
              [ -f "$KSU_DIR/Makefile" ] && sed -i '/kernelsu/d' $KSU_DIR/Makefile
              rm -rf $KSU_PATH
            fi
          done
          echo "✅ Existing MamboSU drivers removed"
          
          # 2. Setup KernelSU (Main Branch -> Standard Kprobes)
          echo "➡️ Using rsuntk/KernelSU setup -> branch main (Standard Kprobes)"
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
          
          # 3. Apply Manager Support Patch
          echo "🛠️ Applying MamboSU Manager Support Patch..."
          curl -LSs "https://raw.githubusercontent.com/Kingfinik98/gki-builder/15ddb8c469eab27491d5bb0f8f66b7fe2c15d0d7/kernel-patches/ksu/rksu-add-mambosu-manager-support.patch" -o /tmp/rksu_manager.patch
          cd KernelSU
          patch -p1 < /tmp/rksu_manager.patch
          cd ..
          echo "✅ Manager Patch Applied"
          
          # 4. NO SUSFS PATCHES
          echo "⏭️ Skipping SusFS patches (Clean Build)."
          
          echo "✅ MamboSU & Hook Method Setup Complete"

      - name: Apply common fixes
        working-directory: gki/common
        run: |
          echo "⏭️ Skipping common fixes"

      - name: Fix Stack Protector
        working-directory: gki/common
        run: |
          echo "🛠️ Applying manual Stack Protector fix"
          sed -i '/config STACKPROTECTOR_PER_TASK/{n;s/def_bool y/bool "Stack Protector per task"\n\tdefault y/;}' arch/arm64/Kconfig
          echo "# CONFIG_STACKPROTECTOR_PER_TASK is not set" >> arch/arm64/configs/gki_defconfig
          echo "✅ Stack Protector fix applied manually."

      - name: Patch module & DRM (Xiaomi Compat)
        working-directory: gki/common
        run: |
          echo "🩹 Menerapkan patch kompatibilitas untuk perangkat Xiaomi"
          sed -i '/pr_warn.*disagrees about version of symbol.*/,+1 s/.*/return 1;/' kernel/module.c
          sed -i '/^static int drm_atomic_check_valid_clones/,/^}/d' drivers/gpu/drm/drm_atomic_helper.c
          sed -i '/ret = drm_atomic_check_valid_clones/,/return ret;/d' drivers/gpu/drm/drm_atomic_helper.c
          echo "✅ Perbaikan selesai"

      - name: Remove check_defconfig
        run: |
          echo "🧹 [Clean-Up] Deleting check_defconfig"
          sed -i 's/check_defconfig//' gki/common/build.config.gki

      - name: Inject All Kernel Configs (ECHO METHOD)
        working-directory: gki/common
        run: |
          echo "⚙️ Menambahkan konfigurasi kernel (Robust Echo Method)"
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          PERFORMANCE_PATCH="${{ github.event.inputs.performance_patch }}"
          
          # === KernelSU Core ===
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPM=y" >> $DEFCONFIG
          
          # === Kprobes Hook (Stabil) ===
          echo "CONFIG_KSU_SUSFS=n" >> $DEFCONFIG
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEFCONFIG
          echo "CONFIG_KSU_HAS_MANUAL_HOOK=n" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          
          if [ "$PERFORMANCE_PATCH" = "MediaTek" ]; then
            echo "CONFIG_HZ=500" >> $DEFCONFIG
            echo "CONFIG_HZ=500" >> $DEFCONFIG
            echo "✅ [MediaTek] Applied HZ=500 config."
          elif [ "$PERFORMANCE_PATCH" = "Universal" ]; then
            echo "CONFIG_HZ_300=y" >> $DEFCONFIG
            echo "CONFIG_CPU_FREQ=y" >> $DEFCONFIG
            echo "CONFIG_HIGH_RES_TIMERS=y" >> $DEFCONFIG
            echo "CONFIG_HZ_300=y" >> $DEFCONFIG
            echo "CONFIG_HIGH_RES_TIMERS=y" >> $DEFCONFIG
            echo "✅ [Universal] Applied universal configuration."
          fi
          
          # Additional Optimasi
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_BIC=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_HTCP=n" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_BBR=y" >> $DEFCONFIG
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> $DEFCONFIG
          echo "CONFIG_SCHED_TUNE=y" >> $DEFCONFIG
          echo "CONFIG_MQ_IOSCHED_KYBER=y" >> $DEFCONFIG
          echo "CONFIG_MQ_IOSCHED_BFQ=y" >> $DEFCONFIG
          echo "CONFIG_IOSCHED_BFQ=y" >> $DEFCONFIG
          echo "CONFIG_BFQ_GROUP_IOSCHED=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_WRITEBACK=y" >> $DEFCONFIG

      - name: Set version
        working-directory: gki/common
        run: |
          echo "" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          KERNEL_NAME_INPUT="${{ github.event.inputs.kernel_name }}"
          PERFORMANCE_PATCH="${{ github.event.inputs.performance_patch }}"

          SUFFIX=""
          if [ -n "$KERNEL_NAME_INPUT" ]; then
            SUFFIX="-$KERNEL_NAME_INPUT"
          fi

          if [ "$PERFORMANCE_PATCH" = "Snapdragon" ]; then
            SUFFIX="$SUFFIX-Qcom"
          elif [ "$PERFORMANCE_PATCH" = "MediaTek" ]; then
            SUFFIX="$SUFFIX-Mtk"
          elif [ "$PERFORMANCE_PATCH" = "Universal" ]; then
            SUFFIX="$SUFFIX-Univ"
          fi
          
          echo "Setting custom kernel name: $SUFFIX"
          if grep -q '^EXTRAVERSION *=' Makefile; then
            sed -i "s/^EXTRAVERSION *=.*/EXTRAVERSION = $SUFFIX/" Makefile
          else
            echo "EXTRAVERSION = $SUFFIX" >> Makefile
          fi

      - name: Setup Clang
        working-directory: gki
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            CLANG_VER="clang-r536225"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            CLANG_VER="clang-r547379"
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          echo "CLANG_VER=$CLANG_VER" >> $GITHUB_ENV
          mkdir -p prebuilts-master/clang/host/linux-x86/$CLANG_VER
          cd prebuilts-master/clang/host/linux-x86
          curl -L "${CLANG_URL}" | tar -xz -C $CLANG_VER
          rm -rf clang-r563880b
          ln -sf $CLANG_VER clang-r563880b

      - name: Commit changes
        working-directory: gki/common
        run: |
          git add .
          git commit -m "Final clean tree before build" || true

      - name: Compile
        working-directory: gki
        run: |
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Setup Environment Variables for Packaging
        id: vars
        run: |
          BASE_LINUX_VERSION=$(make -s kernelversion -C gki/common | tr -d '\n\r')
          echo "BASE_LINUX_VERSION=$BASE_LINUX_VERSION" >> $GITHUB_ENV
          
          LINUX_VERSION=$(make -s kernelversion -C gki/common | tr -d '\n\r')
          echo "LINUX_VERSION=$LINUX_VERSION" >> $GITHUB_ENV
          
          CUSTOM_KERNEL_NAME="${{ github.event.inputs.kernel_name }}"
          if [ -z "$CUSTOM_KERNEL_NAME" ]; then
            KERNEL_NAME="BoltX"
          else
            KERNEL_NAME="$CUSTOM_KERNEL_NAME"
          fi

          STATUS="${{ github.event.inputs.release_status }}"
          CLANG_VERSION_STRING="${{ github.event.inputs.clang_version }}"

          BUILD_DATE=$(date +"%Y%m%d")
          KBUILD_BUILD_TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S %Z")
          RELEASE="v${BUILD_DATE}"
          
          AK3_ZIP_NAME="AK3-${KERNEL_NAME}-${RELEASE}-${BASE_LINUX_VERSION}-Standard.zip"
          
          echo "KERNEL_NAME=$KERNEL_NAME" >> $GITHUB_ENV
          echo "STATUS=$STATUS" >> $GITHUB_ENV
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "AK3_ZIP_NAME=$AK3_ZIP_NAME" >> $GITHUB_ENV
          echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> $GITHUB_ENV
          echo "KSU=MamboSU" >> $GITHUB_ENV
          echo "COMPILER_STRING=$CLANG_VERSION_STRING" >> $GITHUB_ENV

      - name: Package Kernel (AnyKernel3)
        run: |
          echo "🚀 Starting kernel packaging process..."
          ANYKERNEL_REPO="https://github.com/linastorvaldz/anykernel"
          ANYKERNEL_BRANCH="android12-5.10"
          KERNEL_IMAGE="$GITHUB_WORKSPACE/gki/out/android12-5.10/dist/Image"
          echo "🔽 Cloning anykernel from $ANYKERNEL_REPO"
          git clone -q --depth=1 $ANYKERNEL_REPO -b $ANYKERNEL_BRANCH anykernel
          
          KERNEL_STRING="${{ env.LINUX_VERSION }}"
          sed -i "s|kernel.string=.*|kernel.string=$KERNEL_STRING|g" anykernel/anykernel.sh

          cd anykernel
          echo "🗜️ Zipping anykernel..."
          cp "$KERNEL_IMAGE" .
          zip -r9 ../${{ env.AK3_ZIP_NAME }} ./*
          cd ..
          echo "✅ Zip file created: ${{ env.AK3_ZIP_NAME }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🚀 Creating GitHub Release..."
          GKI_RELEASES_REPO="https://github.com/Kingfinik98/Kernel-Release"
          REPO_PATH=$(echo "$GKI_RELEASES_REPO" | sed 's|https://github.com/||')
          RELEASE_TAG="${{ env.KERNEL_NAME }}-${{ env.LINUX_VERSION }}-${{ env.RELEASE }}"
          RELEASE_NOTES="🐧 *Linux Version*: ${{ env.LINUX_VERSION }}
          📅 *Build Date*: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          📛 *MamboSU*: ${{ env.KSU }}
          🔰 *Compiler*: ${{ env.COMPILER_STRING }}"
          🔗 *Hook Method*: Standard Kprobes"
          gh release create "$RELEASE_TAG" "${{ env.AK3_ZIP_NAME }}" \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --repo "$REPO_PATH" \
            --latest
          echo "✅ Release created successfully at https://github.com/$REPO_PATH/releases/tag/$RELEASE_TAG"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.performance_patch }}
          path: gki/out/android12-5.10/common/build.log
          if-no-files-found: warn